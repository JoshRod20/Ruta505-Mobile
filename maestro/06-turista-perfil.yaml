# E2E06: Turista inicia sesión y abre su Perfil
# Uso: maestro test -e CORREO=usuario -e CLAVE=contraseña maestro/06-turista-perfil.yaml
appId: com.kennrod20.Ruta505
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Saltar"
    timeout: 60000
- tapOn: "Saltar"
- extendedWaitUntil:
    visible: "Iniciar Sesión"
    timeout: 30000
- tapOn: "Iniciar Sesión"
- tapOn: "Nombre de usuario o correo"
- inputText: ${CORREO}
- hideKeyboard
- extendedWaitUntil:
    visible: "Contraseña"
    timeout: 10000
- tapOn: "Contraseña"
- inputText: ${CLAVE}
- hideKeyboard
- tapOn:
    text: "Iniciar Sesión"
    index: 1
#- tapOn:
#    text: "Mientras la app está en uso"
 #   optional: true
#- tapOn:
 #   text: "Al usar la app"
 #   optional: true
- extendedWaitUntil:
    visible:
      id: "tab-Perfil"
    timeout: 45000
- tapOn:
    id: "tab-Perfil"
- extendedWaitUntil:
    visible: "Guardados"
    timeout: 20000
- assertVisible: "Guardados"
- assertVisible: "ACCIONES"
- assertVisible: "Editar perfil"
- assertVisible: "Configuración"
- takeScreenshot: e2e06-perfil

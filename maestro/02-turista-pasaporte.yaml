# E2E02: Turista inicia sesión y abre el Pasaporte Cultural
# Uso: maestro test -e CORREO=usuario -e CLAVE=contraseña maestro/02-turista-pasaporte.yaml
appId: com.kennrod20.Ruta505
---
- launchApp:
    clearState: true

# 1. Saltar el onboarding
- extendedWaitUntil:
    visible: "Saltar"
    timeout: 60000
- tapOn: "Saltar"

# 2. Iniciar sesión
- extendedWaitUntil:
    visible: "Iniciar Sesión"
    timeout: 30000
- tapOn: "Iniciar Sesión"
- tapOn: "Nombre de usuario o correo"
- inputText: ${CORREO}
- hideKeyboard
- extendedWaitUntil:
    visible: "Contraseña"
    timeout: 10000
- tapOn: "Contraseña"
- inputText: ${CLAVE}
- hideKeyboard
- tapOn:
    text: "Iniciar Sesión"
    index: 1

# # Permiso de ubicación, si el teléfono lo pregunta
# - 
# tapOn:
#     text: "Mientras la app está en uso"
#     optional: true
# - 
# tapOn:
#     text: "Al usar la app"
#     optional: true

# 3. Esperar la barra inferior del turista
- extendedWaitUntil:
    visible:
      id: "tab-Pasaporte"
    timeout: 45000

# 4. Pestaña Pasaporte
- tapOn:
    id: "tab-Pasaporte"
- extendedWaitUntil:
    visible: "Mi Pasaporte"
    timeout: 20000
- assertVisible: "Mi Pasaporte"

# 5. Secciones del pasaporte y captura
- assertVisible: "Rutas"
- assertVisible: "Insignias"
- scrollUntilVisible:
    element: "Niveles de Perfiles"
- takeScreenshot: e2e02-pasaporte

# Subflujo: inicia sesión como actor cultural y deja la app en el Inicio con la barra inferior.
# No se ejecuta solo; lo llaman los flujos 09-17 con runFlow.
# Si la cuenta aún está "en revisión", toca "Explorar" para entrar igual
# (en ese caso la barra inferior sí aparece, pero no se puede publicar).
appId: com.kennrod20.Ruta505
---
- launchApp:
    clearState: true

# 1. Saltar el onboarding
- extendedWaitUntil:
    visible: "Saltar"
    timeout: 60000
- tapOn: "Saltar"

# 2. Iniciar sesión
- extendedWaitUntil:
    visible: "Iniciar Sesión"
    timeout: 30000
- tapOn: "Iniciar Sesión"
- tapOn: "Nombre de usuario o correo"
- inputText: ${CORREO}
- hideKeyboard
- extendedWaitUntil:
    visible: "Contraseña"
    timeout: 10000
- tapOn: "Contraseña"
- inputText: ${CLAVE}
- hideKeyboard
- tapOn:
    text: "Iniciar Sesión"
    index: 1

# 3. Cuenta en revisión: entrar con "Explorar"; cuenta aprobada: ya está en el Inicio
- extendedWaitUntil:
    visible: "Explorar|Visualiza aquí todas tus publicaciones.*"
    timeout: 45000
- runFlow:
    when:
      visible: "Explorar"
    commands:
      - tapOn: "Explorar"

# 4. Esperar la barra inferior del actor
- extendedWaitUntil:
    visible:
      id: "tab-Perfil cultural"
    timeout: 30000

# E2E12: El actor cultural genera el código QR del Pasaporte Cultural
# Uso: maestro test -e CORREO=actor@correo.com -e CLAVE=contraseña maestro/12-actor-generar-qr.yaml
# Si el actor ya generó su QR antes, la pantalla abre directo en el código.
appId: com.kennrod20.Ruta505
---
- runFlow:
    file: subflows/login-actor.yaml
    env:
      CORREO: ${CORREO}
      CLAVE: ${CLAVE}

- tapOn:
    id: "tab-Generar QR"
- extendedWaitUntil:
    visible: "Generar código QR|QR del Pasaporte Cultural"
    timeout: 20000

# Primera vez: pantalla de bienvenida con el botón
- runFlow:
    when:
      visible: "Generar código QR"
    commands:
      - assertVisible: "¡Bienvenido! Crea aquí el código QR de.*"
      - takeScreenshot: e2e12-qr-bienvenida
      - tapOn: "Generar código QR"

# Tarjeta con el QR
- extendedWaitUntil:
    visible: "QR del Pasaporte Cultural"
    timeout: 15000
- assertVisible: "Vinculado a:.*"
- assertVisible: "Imprime este código.*"
- assertVisible: "Descargar"
- takeScreenshot: e2e12-qr-generado
